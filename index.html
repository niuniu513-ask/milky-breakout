<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fff3e0">
<meta name="description" content="奶蛙打砖块 · 纯前端单机小游戏：奶蛙接奶珠，打碎奶块，连击拿高分。">
<title>奶蛙打砖块</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: linear-gradient(180deg, #fff3e0 0%, #ffe8c8 100%);
    display: flex; align-items: center; justify-content: center;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden; touch-action: none; user-select: none;
    -webkit-user-select: none;
  }
  #wrap {
    position: relative;
    background: #fffdf6;
    border-radius: 18px;
    box-shadow: 0 12px 40px rgba(180, 130, 60, 0.25);
    overflow: hidden;
  }
  canvas { display: block; touch-action: none; }

  /* ===== 覆盖层 ===== */
  #overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(255, 243, 224, 0.88);
    backdrop-filter: blur(3px);
    z-index: 10;
  }
  #overlay.hidden { display: none; }
  .dialog {
    width: 78%; max-width: 340px;
    max-height: calc(100% - 20px); overflow-y: auto;
    background: #fffdf6;
    border: 3px solid #ffd98a;
    border-radius: 20px;
    padding: 26px 22px;
    text-align: center;
    box-shadow: 0 8px 24px rgba(200, 150, 70, 0.2);
  }
  .dialog .emoji { font-size: 44px; line-height: 1; }
  .dialog h1 { color: #4a3b22; font-size: 24px; margin: 10px 0 6px; }
  .dialog h2 { color: #4a3b22; font-size: 20px; margin: 10px 0 6px; }
  .dialog p { color: #8a7a5c; font-size: 14px; margin: 6px 0; line-height: 1.6; }
  .dialog .score-big { color: #e8963c; font-size: 30px; font-weight: 700; }
  .dialog .best-line { color: #b09a6e; font-size: 13px; }
  .btn {
    display: inline-block;
    margin: 14px 6px 2px;
    padding: 12px 30px;
    font-size: 17px; font-weight: 600;
    color: #4a3b22;
    background: linear-gradient(180deg, #ffe2a0, #ffd06e);
    border: none; border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 4px 0 #e0a83c;
    transition: transform .08s;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #e0a83c; }
  .btn.ghost {
    background: #fffdf6; color: #b09a6e;
    box-shadow: 0 4px 0 #e8dcc0; font-size: 14px; padding: 10px 20px;
  }
  .hint { color: #c4b190; font-size: 12px; margin-top: 12px; }

  /* 排行榜 */
  #board {
    margin: 10px auto 0; max-width: 252px;
    max-height: 104px; overflow-y: auto;
    text-align: left; font-size: 12px;
    background: #fff6e3; border: 1.5px solid #ffe2a0; border-radius: 10px;
    padding: 5px 10px;
  }
  #board .brow { display: flex; gap: 6px; line-height: 1.9; }
  #board .rk { width: 18px; color: #e8963c; font-weight: 700; }
  #board .sc { flex: 1; color: #4a3b22; font-weight: 600; }
  #board .lv { color: #b09a6e; }
  #board .dt { color: #c4b190; }
  #board .empty { text-align: center; color: #c4b190; line-height: 1.8; }

  /* 顶部暂停按钮 */
  #pauseBtn {
    position: absolute; top: 8px; right: 8px; z-index: 5;
    width: 34px; height: 34px;
    border: none; border-radius: 10px;
    background: rgba(255, 255, 255, 0.7);
    color: #b09a6e; font-size: 16px;
    cursor: pointer; display: none;
  }
  #pauseBtn.show { display: block; }
</style>
</head>

function fitCanvas() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const availW = window.innerWidth - 16;
  const availH = window.innerHeight - 16;
  scale = Math.min(availW / W, availH / H);
  cvs.style.width  = (W * scale) + "px";
  cvs.style.height = (H * scale) + "px";
  cvs.width  = Math.round(W * scale * dpr);
  cvs.height = Math.round(H * scale * dpr);
  wrap.style.width  = cvs.style.width;
  wrap.style.height = cvs.style.height;
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}

/* ---------- WebAudio 合成音效 ---------- */
let AC = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } }
  if (AC && AC.state === "suspended") AC.resume();
  return AC;
}
function beep(freq, dur, type, gain) {
  const ac = audio(); if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type || "sine"; o.frequency.value = freq;
  g.gain.setValueAtTime(gain || 0.12, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime + dur);
}

  explode:() => { beep(90, 0.3, "sawtooth", 0.16); setTimeout(() => beep(60, 0.2, "square", 0.1), 60); },
  laser:  () => beep(950, 0.05, "square", 0.05),

/* ---------- 工具 ---------- */
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const rand  = (a, b) => a + Math.random() * (b - a);

function currentSpeed() {
  const lvBoost = (level - 1) * 22 + (endless ? Math.max(0, level - 5) * 14 : 0);
  const slow = effects.slow > 0 ? 0.62 : 1;
  const creep = 1 + Math.min(playTime * 0.004, 0.35);  // 时间越久球越快（封顶 +35%）
  return (BASE_SPEED + lvBoost) * slow * creep;
}

/* 瞄准角：指向指针，限制在上半球 */
function aimAngleFor(b) {
  const dy = lastPointer.y - b.y;
  if (dy >= -4) return lastPointer.x >= b.x ? -0.18 : -Math.PI + 0.18;
  return clamp(Math.atan2(dy, lastPointer.x - b.x), -Math.PI + 0.18, -0.18);
}

/* ---------- 关卡与重置 ---------- */
function buildBricks(lv) {
  bricks = [];
  let rows;
  if (!endless) {
    rows = LEVELS[lv - 1];
  } else {
    // 无尽模式：程序生成，行数与耐久递增
    const n = lv - 5;
    rows = [];
    const rowCount = Math.min(4 + Math.floor(n / 2), 7);
    for (let r = 0; r < rowCount; r++) {
      let row = "";
    for (let c = 0; c < BRICK_COLS; c++) {
      const t = Math.random();
      const maxHp = Math.min(3, 1 + Math.floor(n / 2));
      let ch2;
      if (t < 0.10) ch2 = ".";
      else if (t < 0.17) ch2 = "X";
      else if (t < 0.24) ch2 = "B";
      else ch2 = String(1 + Math.floor(((t - 0.24) / 0.76) * maxHp * 0.999));
      row += ch2;
    }
      rows.push(row);
    }
  }
  const gridW = BRICK_COLS * BRICK_W + (BRICK_COLS - 1) * BRICK_GAP;
  const offX = (W - gridW) / 2;
  rows.forEach((row, r) => {
    for (let c = 0; c < BRICK_COLS; c++) {
      const ch = row[c];
      if (!ch || ch === ".") continue;
      if (ch === "X") {
        // 钢砖：不可摧毁，不计入过关条件
        bricks.push({ x: offX + c * (BRICK_W + BRICK_GAP), y: BRICK_TOP + r * (BRICK_H + BRICK_GAP), w: BRICK_W, h: BRICK_H, hp: 9999, maxHp: 9999, steel: true });
      } else if (ch === "B") {
        // 爆炸奶块：击碎波及 3×3 邻居，可连锁
        bricks.push({ x: offX + c * (BRICK_W + BRICK_GAP), y: BRICK_TOP + r * (BRICK_H + BRICK_GAP), w: BRICK_W, h: BRICK_H, hp: 1, maxHp: 1, boom: true });
      } else {
        const hp = clamp(+ch, 1, 3);
        bricks.push({ x: offX + c * (BRICK_W + BRICK_GAP), y: BRICK_TOP + r * (BRICK_H + BRICK_GAP), w: BRICK_W, h: BRICK_H, hp, maxHp: hp });
      }
    }
  });
}

function resetBall() {

/* ---------- 输入 ---------- */
function pointerX(e) {
  const rect = cvs.getBoundingClientRect();
  const cx = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
  return cx / scale;
}
cvs.addEventListener("pointermove", (e) => {
  const rect = cvs.getBoundingClientRect();
  lastPointer.x = ((e.touches ? e.touches[0].clientX : e.clientX) - rect.left) / scale;
  lastPointer.y = ((e.touches ? e.touches[0].clientY : e.clientY) - rect.top) / scale;
  if (state !== S.PLAY) return;
  paddle.x = clamp(lastPointer.x, paddle.w / 2, W - paddle.w / 2);
});
cvs.addEventListener("pointerdown", (e) => {
  audio();
  if (state !== S.PLAY) return;
  if (!launched) launch();
  else releaseHeld();
});
window.addEventListener("keydown", (e) => {
  if (e.key === " " || e.code === "Space") {
    e.preventDefault();
    if (state === S.PLAY) { if (!launched) launch(); else releaseHeld(); }
  } else if (e.key === "p" || e.key === "P") {
    togglePause();
  } else if (state === S.PLAY && (e.key === "ArrowLeft" || e.key === "ArrowRight")) {
    // 键盘移动在 update 里处理
    keys[e.key] = true;
  }
});
window.addEventListener("keyup", (e) => { keys[e.key] = false; });
const keys = {};

function launch() {
  if (launched) return;
  launched = true;
  const speed = currentSpeed();
  balls.forEach(b => {
    const a = aimAngleFor(b);   // 指针瞄准，不再随机
    b.vx = Math.cos(a) * speed; b.vy = Math.sin(a) * speed; b.stuck = false;
  });
  SFX.paddle();
}

/* 释放磁力挡板吸住的球：按吸住位置决定出射角 */
function releaseHeld() {
  let any = false;
  const speed = currentSpeed();
  balls.forEach(b => {
    if (!b.held) return;
    b.held = false; b.stuck = false;
    const rel = clamp(b.catchOff || 0, -paddle.w / 2, paddle.w / 2) / (paddle.w / 2);
    const a = -Math.PI / 2 + rel * (Math.PI / 3);
    b.vx = Math.cos(a) * speed; b.vy = Math.sin(a) * speed;
    any = true;
  });
  if (any) SFX.paddle();
}

/* ---------- 粒子 ---------- */
function burst(x, y, color, n) {
  for (let i = 0; i < (n || 9); i++) {
    const a = rand(0, Math.PI * 2), sp = rand(60, 220);
    parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60, r: rand(2, 4.5), life: rand(0.35, 0.7), t: 0, color });
  }
}

/* ---------- 道具 ---------- */
function maybeDrop(x, y) {
  if (Math.random() > (frenzy > 0 ? 0.32 : 0.15)) return;  // 暴走时掉率翻倍
  // DX-Ball 式风险回报：85% 好道具，15% 坏道具
  const good = ["wide", "multi", "slow", "pierce", "laser", "catch"];
  const bad = ["shrink", "fast"];
  const type = Math.random() < 0.85
    ? good[Math.floor(Math.random() * good.length)]
    : bad[Math.floor(Math.random() * bad.length)];
  powers.push({ x, y, type, vy: 120 });
}
function applyPower(type) {
  SFX.power();
  paddle.face = "happy"; paddle.faceTimer = 1.2;
  if (type === "wide") { effects.wide = 10; paddle.w = paddle.baseW * 1.5; }
  else if (type === "slow") { effects.slow = 8; balls.forEach(b => { const s = currentSpeed(); const m = Math.hypot(b.vx, b.vy) || 1; b.vx *= s / m; b.vy *= s / m; }); }
  else if (type === "pierce") { effects.pierce = 10; }
  else if (type === "laser") { effects.laser = 8; }
  else if (type === "catch") { effects.catch = 10; }
  else if (type === "shrink") { paddle.w = paddle.baseW * 0.65; effects.wide = 0; paddle.face = "hurt"; paddle.faceTimer = 1.2; }
  else if (type === "fast") { balls.forEach(b => { if (b.stuck) return; const s = currentSpeed() * 1.35; const m = Math.hypot(b.vx, b.vy) || 1; b.vx *= s / m; b.vy *= s / m; }); }
  else if (type === "multi") {
    const src = balls[0]; if (!src) return;
    for (let k = 0; k < 2; k++) {
      const a = Math.atan2(src.vy || -1, src.vx || 0) + (k === 0 ? 0.5 : -0.5);
      const s = currentSpeed();
      balls.push({ x: src.x, y: src.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, speed: s, stuck: false, frog: true });
    }
  }
}

/* ---------- 碰撞 ---------- */
function damageBrick(k, dmg, ball) {
  if (k.steel) { SFX.wall(); return; }
  k.hp -= dmg;
  if (k.hp > 0) {
    SFX.brick(k.hp);
    if (ball) burst(ball.x, ball.y, BRICK_COLORS[k.hp] || "#ffd98a", 4);
    return;
  }
  destroyBrick(k);
}

function destroyBrick(k) {
  const i = bricks.indexOf(k);
  if (i >= 0) bricks.splice(i, 1);
  combo++;
  maxCombo = Math.max(maxCombo, combo);
  const mult = Math.min(1 + Math.floor(combo / 4), MAX_COMBO_MULT) * (frenzy > 0 ? 2 : 1);
  score += 10 * k.maxHp * mult;
  scoreScale = 1.45;
  burst(k.x + k.w / 2, k.y + k.h / 2, BRICK_COLORS[k.maxHp] || "#f28a7b", 14);
  maybeDrop(k.x + k.w / 2, k.y + k.h / 2);
  shake = Math.min(shake + 2.5, 8);
  rings.push({ x: k.x + k.w / 2, y: k.y + k.h / 2, t: 0, life: 0.45, max: 34 + k.maxHp * 8, color: BRICK_COLORS[k.maxHp] || "#f2a05a" });
  if (Math.random() < 0.07) spawnDanmaku(MEME_QUOTES[Math.floor(Math.random() * MEME_QUOTES.length)]);
  SFX.brick(k.maxHp);
  // 奶块里住着一只小奶蛙：解救！
  rescued++;
  if (rescueFrogs.length < 24) {
    rescueFrogs.push({ x: k.x + k.w / 2, y: k.y + k.h / 2, vx: rand(-70, 70), vy: rand(-280, -180), rot: 0, vr: rand(-4, 4), t: 0 });
  }
  // 连击里程碑：+50 并必掉一个道具
  if (combo === 6 || combo === 12) {
    score += 50;
    const pool = ["wide", "multi", "slow", "pierce", "laser", "catch"];
    powers.push({ x: k.x + k.w / 2, y: k.y + k.h / 2, type: pool[Math.floor(Math.random() * pool.length)], vy: 120 });
    floats.push({ x: k.x + k.w / 2, y: k.y, txt: "连击 ×" + combo + "！+50", t: 0, life: 1.2, color: "#e8963c", size: 15 });
  }
  // 暴走模式：连击 8 触发，8 秒分数×2
  if (combo === 8 && frenzy <= 0) {
    frenzy = 8;
    shake = 12;
    spawnDanmaku("奶力暴走！！！", true);
    spawnDanmaku("分数 ×2 冲鸭！！", false);
    burst(paddle.x, PADDLE_Y - 30, "#f2a05a", 24);
    SFX.frenzy();
  }
  // 终结慢动作：打碎最后一块砖
  if (!bricks.some(n => !n.steel)) {
    slowmoT = 0.55;
    spawnDanmaku("最后一块奶块！", true);
    SFX.slowmo();
  }
  // 爆炸奶块：波及 3×3 邻居，可连锁
  if (k.boom) {
    shake = Math.min(shake + 4, 10);
    SFX.explode();
    burst(k.x + k.w / 2, k.y + k.h / 2, "#f28a7b", 16);
    bricks.slice().forEach(n => {
      if (n.steel) return;
      if (Math.abs(n.x - k.x) <= BRICK_W + BRICK_GAP && Math.abs(n.y - k.y) <= BRICK_H + BRICK_GAP) {
        damageBrick(n, 2);
      }
    });
  }
}

function stepBall(b, dt) {
  if (b.stuck) {
    b.x = b.held ? paddle.x + (b.catchOff || 0) : paddle.x;
    b.y = PADDLE_Y - BALL_R - 12;
    return;
  }
  b.x += b.vx * dt; b.y += b.vy * dt;
  // 奶蛙分身拖尾
  if (b.frog) {
    b.trail = b.trail || [];
    b.trail.push({ x: b.x, y: b.y });
    if (b.trail.length > 9) b.trail.shift();
  }

  // 墙壁
  if (b.x < BALL_R) { b.x = BALL_R; b.vx = Math.abs(b.vx); SFX.wall(); }
  if (b.x > W - BALL_R) { b.x = W - BALL_R; b.vx = -Math.abs(b.vx); SFX.wall(); }
  if (b.y < BALL_R) { b.y = BALL_R; b.vy = Math.abs(b.vy); SFX.wall(); }

  // 挡板
  if (b.vy > 0 && b.y + BALL_R >= PADDLE_Y && b.y - BALL_R <= PADDLE_Y + paddle.h) {
    if (b.x >= paddle.x - paddle.w / 2 - BALL_R && b.x <= paddle.x + paddle.w / 2 + BALL_R) {
      // 磁力挡板：吸住待重新瞄准
      if (effects.catch > 0 && !b.held) {
        b.stuck = true; b.held = true;
        b.catchOff = clamp(b.x - paddle.x, -paddle.w / 2 + 8, paddle.w / 2 - 8);
        paddle.face = "happy"; paddle.faceTimer = 1;
        SFX.catch();
        return;
      }
      b.y = PADDLE_Y - BALL_R;
      // 击中位置决定反弹角：核心手感
      const rel = clamp((b.x - paddle.x) / (paddle.w / 2), -1, 1);
      const maxA = Math.PI / 2.6;
      const a = -Math.PI / 2 + rel * maxA;
      const sp = currentSpeed();
      b.vx = Math.cos(a) * sp; b.vy = Math.sin(a) * sp;
      combo = 0; // 连击清零
      paddle.face = "normal";
      SFX.paddle();
      rings.push({ x: b.x, y: PADDLE_Y, t: 0, life: 0.35, max: 26, color: "#e0a83c" });
    }
  }

  // 砖块
  for (let i = bricks.length - 1; i >= 0; i--) {
    const k = bricks[i];
    if (!bricks.includes(k)) continue;  // 爆炸连锁可能已移除
    const cx = clamp(b.x, k.x, k.x + k.w), cy = clamp(b.y, k.y, k.y + k.h);
    const dx = b.x - cx, dy = b.y - cy;
    if (dx * dx + dy * dy > BALL_R * BALL_R) continue;
    damageBrick(k, 1, b);
    // 钢砖永远反弹；穿透模式下普通砖不反弹
    if (k.steel || effects.pierce <= 0) {
      // 判定反弹轴
      if (Math.abs(dx) > Math.abs(dy)) { b.vx = dx > 0 ? Math.abs(b.vx) : -Math.abs(b.vx); b.x = dx > 0 ? k.x + k.w + BALL_R : k.x - BALL_R; }
      else { b.vy = dy > 0 ? Math.abs(b.vy) : -Math.abs(b.vy); b.y = dy > 0 ? k.y + k.h + BALL_R : k.y - BALL_R; }
      break;
    }
  }

  // 掉出底部
  if (b.y > H + 30) b.dead = true;
}

/* ---------- 结束 / 过关 ---------- */
function loseLife() {
  lives--;
  SFX.lose();
  spawnDanmaku(SAD_QUOTES[Math.floor(Math.random() * SAD_QUOTES.length)], true);
  paddle.face = "hurt"; paddle.faceTimer = 1.4;
  effects.wide = 0; effects.slow = 0; effects.pierce = 0; effects.laser = 0; effects.catch = 0;
  paddle.w = paddle.baseW;
  if (lives <= 0) {
    gameOver(false);
  } else {
    balls = []; powers = []; combo = 0;
    resetBall();
  }
}
function gameOver(cleared) {
  state = S.OVER;
  const isNew = score > best;
  if (isNew) { best = score; localStorage.setItem("milkyBreakout.best", best); }
  const rank = recordBoard();
  $("overScore").textContent = score;
  $("overBest").textContent = best;
  $("overNew").textContent = isNew ? "新纪录！🎉" : "未破纪录";
  $("overRank").textContent = rank > 0 ? "#" + rank : "未进前十";
  $("overLevel").textContent = level + (endless ? "（无尽）" : "");
  $("overRescue").textContent = rescued;
  $("overEmoji").textContent = cleared ? "🏆" : "😵";
  $("overTitle").textContent = cleared ? "通关啦！" : "游戏结束";
  showDlg("dlgOver");
}
function levelClear() {
  SFX.win();
  spawnDanmaku("过关！蛙哈哈哈！", true);
  spawnDanmaku(MEME_QUOTES[Math.floor(Math.random() * MEME_QUOTES.length)], false);
  burst(W / 2, H / 2, "#ffd98a", 30);
  const enteringEndless = !endless && level >= LEVELS.length;
  $("levelScore").textContent = score;
  $("levelTitle").textContent = enteringEndless ? "五大关通关！进入无尽模式" : ("第 " + level + " 关过关！");
  if (enteringEndless) endless = true;
  state = S.LEVELUP;
  showDlg("dlgLevel");
}

/* ---------- 更新 ---------- */
function update(dt) {
  if (state !== S.PLAY) return;
  playTime += dt;

  // 键盘移动
  if (keys["ArrowLeft"])  paddle.x = clamp(paddle.x - 420 * dt, paddle.w / 2, W - paddle.w / 2);
  if (keys["ArrowRight"]) paddle.x = clamp(paddle.x + 420 * dt, paddle.w / 2, W - paddle.w / 2);

  // 效果计时
  if (effects.wide  > 0) { effects.wide  -= dt; if (effects.wide  <= 0) paddle.w = paddle.baseW; }
  if (effects.slow  > 0) { effects.slow  -= dt; if (effects.slow  <= 0) balls.forEach(b => { if (b.stuck) return; const s = currentSpeed(); const m = Math.hypot(b.vx, b.vy) || 1; b.vx *= s / m; b.vy *= s / m; }); }
  if (effects.pierce > 0) effects.pierce -= dt;
  if (effects.laser > 0) {
    effects.laser -= dt;
    laserTimer -= dt;
    if (laserTimer <= 0) {
      laserTimer = 0.45;
      bullets.push({ x: paddle.x - paddle.w / 2 + 6, y: PADDLE_Y - 6 });
      bullets.push({ x: paddle.x + paddle.w / 2 - 6, y: PADDLE_Y - 6 });
      SFX.laser();
    }
  }
  if (effects.catch > 0) effects.catch -= dt;
  // 激光奶弹
  for (let i = bullets.length - 1; i >= 0; i--) {
    const bl = bullets[i];
    bl.y -= 540 * dt;
    if (bl.y < -10) { bullets.splice(i, 1); continue; }
    for (let j = bricks.length - 1; j >= 0; j--) {
      const k = bricks[j];
      if (bl.x >= k.x && bl.x <= k.x + k.w && bl.y >= k.y && bl.y <= k.y + k.h) {
        damageBrick(k, 1, null);
        bullets.splice(i, 1);
        break;
      }
    }
  }
  if (paddle.faceTimer > 0) { paddle.faceTimer -= dt; if (paddle.faceTimer <= 0) paddle.face = "normal"; }
  if (shake > 0) shake = Math.max(0, shake - dt * 22);
  if (frenzy > 0) frenzy -= dt;
  if (scoreScale > 1) scoreScale = Math.max(1, scoreScale - dt * 2.2);
  fxTime += dt;

  // 进化判定
  while (stage < STAGE_AT.length - 1 && score >= STAGE_AT[stage + 1]) {
    stage++;
    floats.push({ x: paddle.x, y: PADDLE_Y - 64, txt: "进化！" + STAGE_NAMES[stage], t: 0, life: 1.6, color: "#e8963c", size: 20 });
    burst(paddle.x, PADDLE_Y - 26, "#ffe2a0", 16);
    SFX.evolve();
  }

  // 解救出的小奶蛙
  for (let i = rescueFrogs.length - 1; i >= 0; i--) {
    const f = rescueFrogs[i];
    f.t += dt; f.vy += 520 * dt;
    f.x += f.vx * dt; f.y += f.vy * dt; f.rot += f.vr * dt;
    if (f.t > 3 || f.y > H + 40) rescueFrogs.splice(i, 1);
  }
  // 飘字
  for (let i = floats.length - 1; i >= 0; i--) {
    const f = floats[i];
    f.t += dt; f.y -= 24 * dt;
    if (f.t >= f.life) floats.splice(i, 1);
  }
  // 抽象弹幕
  for (let i = danmaku.length - 1; i >= 0; i--) {
    const d = danmaku[i];
    d.t += dt; d.x += d.vx * dt;
    if (d.t >= d.life || d.x < -300 || d.x > W + 300) danmaku.splice(i, 1);
  }
  // 奶波涟漪
  for (let i = rings.length - 1; i >= 0; i--) {
    rings[i].t += dt;
    if (rings[i].t >= rings[i].life) rings.splice(i, 1);
  }

  // 球
  balls.forEach(b => stepBall(b, dt));
  balls = balls.filter(b => !b.dead);
  if (balls.length === 0) { loseLife(); return; }

  // 道具掉落
  for (let i = powers.length - 1; i >= 0; i--) {
    const p = powers[i];
    p.y += p.vy * dt;
    if (p.y > H + 20) { powers.splice(i, 1); continue; }
    if (p.y + 10 >= PADDLE_Y && p.y - 10 <= PADDLE_Y + paddle.h &&
        Math.abs(p.x - paddle.x) < paddle.w / 2 + 12) {
      applyPower(p.type); powers.splice(i, 1);
    }
  }

  // 粒子
  for (let i = parts.length - 1; i >= 0; i--) {
    const q = parts[i];
    q.t += dt;
    if (q.t >= q.life) { parts.splice(i, 1); continue; }
    q.vy += 420 * dt; q.x += q.vx * dt; q.y += q.vy * dt;
  }

  // 过关判定（钢砖不算；终结慢动作播完再弹窗）
  if (!bricks.some(k => !k.steel) && slowmoT <= 0) levelClear();
}

const STAGE_NAMES = ["\u5c0f\u5976\u86d9", "\u5976\u5a03\u5d3d", "\u5976\u9f20", "\u5976\u72d7", "\u5929\u4f7f\u5976\u86d9", "\u5976\u86d9\u795e"];
const STAGE_AT = [0, 400, 1000, 2000, 3500, 5500];
const STAGE_IMGS = STAGE_SRC.map(src => { const i = new Image(); i.src = src; return i; });
let stage = 0;

/* generic sprite draw: fit into size x size, optional rot/alpha */
function drawSprite(im, x, y, size, rot, alpha) {
  if (!im.complete || !im.naturalWidth) return;
  const r = im.naturalWidth / im.naturalHeight;
  const w = r >= 1 ? size : size * r;
  const h = r >= 1 ? size / r : size;
  ctx.save();
  ctx.translate(x, y);
  if (rot) ctx.rotate(rot);
  if (alpha !== undefined) ctx.globalAlpha = alpha;
  ctx.drawImage(im, -w / 2, -h / 2, w, h);
  ctx.restore();
}

/* paddle frog: bottom-anchored at y, evolves with score */
function drawFrog(x, y, face, s) {
  s = s || 1;
  const im = frenzy > 0 ? STAGE_IMGS[Math.floor(fxTime * 6) % STAGE_IMGS.length] : (STAGE_IMGS[stage] || STAGE_IMGS[0]);
  const d = 46 * s;
  let w = d, h = d;
  if (im.complete && im.naturalWidth) {
    const r = im.naturalWidth / im.naturalHeight;
    if (r >= 1) h = d / r; else w = d * r;
  }
  ctx.save();
  ctx.translate(x, y);
  if (face === "hurt") ctx.rotate(0.16);
  if (im.complete && im.naturalWidth) {
    ctx.drawImage(im, -w / 2, 2 - h, w, h);
  } else {
    ctx.fillStyle = "#f8dd6f";
    ctx.beginPath(); ctx.ellipse(0, -d / 2 + 2, d / 2, d / 2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#d3ab3e"; ctx.lineWidth = 2; ctx.stroke();
  }
  if (face === "happy") {
    ctx.fillStyle = "#f27b7b";
    ctx.font = "700 12px sans-serif"; ctx.textAlign = "center";
    ctx.fillText("\u2665", -10 * s, 2 - h - 4);
    ctx.fillText("\u2665", 12 * s, 2 - h - 8);
  } else if (face === "hurt") {
    ctx.fillStyle = "#7bb3f2";
    ctx.beginPath(); ctx.ellipse(w / 2, 2 - h + 8, 3, 4.5, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

/* ---------- 绘制 ---------- */
function draw() {
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  if (shake > 0) ctx.translate(rand(-shake, shake), rand(-shake, shake));

  // 背景
  if (frenzy > 0) {
    // 暴走彩虹流光背景
    for (let i = 0; i < 6; i++) {
      ctx.fillStyle = "hsl(" + Math.round((fxTime * 90 + i * 60) % 360) + " 85% 91%)";
      ctx.fillRect(-10, -10 + (H + 20) / 6 * i, W + 20, (H + 20) / 6 + 1);
    }
  } else {
    ctx.fillStyle = "#fffdf6"; ctx.fillRect(-10, -10, W + 20, H + 20);
  }
  // 连击光晕 / 暴走光环
  if (combo >= 4 || frenzy > 0) {
    const glow = frenzy > 0 ? 0.45 : Math.min((combo - 4) / 16, 0.3);
    const grd = ctx.createRadialGradient(W / 2, H / 2, H * 0.42, W / 2, H / 2, H * 0.78);
    grd.addColorStop(0, "rgba(240,130,40,0)");
    grd.addColorStop(1, "rgba(240,130,40," + glow + ")");
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, W, H);
  }
  // 顶部信息条
  ctx.fillStyle = "rgba(255,217,138,0.25)";
  ctx.fillRect(0, 0, W, 64);
  ctx.fillStyle = "#4a3b22";
  ctx.font = "700 17px 'PingFang SC','Microsoft YaHei',sans-serif";
  ctx.textAlign = "left";
  ctx.save();
  ctx.translate(16, 28);
  ctx.scale(scoreScale, scoreScale);
  ctx.fillText("得分 " + score, 0, 0);
  ctx.restore();
  ctx.textAlign = "center";
  ctx.fillText("第 " + level + " 关" + (endless ? "（无尽）" : ""), W / 2, 28);
  ctx.textAlign = "right";
  ctx.fillText(("❤".repeat(Math.max(lives, 0)) || "—") + "  🐸×" + rescued, W - 16, 28);
  // 连击
  ctx.textAlign = "left";
  ctx.font = "600 13px 'PingFang SC',sans-serif";
  ctx.fillStyle = combo >= 4 ? "#e8963c" : "#c4b190";
  const mult = Math.min(1 + Math.floor(combo / 4), MAX_COMBO_MULT);
  ctx.fillText(combo > 1 ? ("连击 ×" + combo + "（倍率 ×" + mult + "）") : "连击 0", 16, 52);
  // 暴走提示
  if (frenzy > 0) {
    ctx.textAlign = "center";
    ctx.font = "800 14px sans-serif";
    ctx.fillStyle = "hsl(" + Math.round((fxTime * 200) % 360) + " 80% 42%)";
    ctx.fillText("暴走中！分数×2  " + Math.ceil(frenzy) + "s", W / 2, 52);
  }
  // 效果状态
  let ex = W - 16;
  [["wide", effects.wide], ["slow", effects.slow], ["pierce", effects.pierce], ["laser", effects.laser], ["catch", effects.catch]].forEach(([t, v]) => {
    if (v > 0) {
      ctx.textAlign = "right";
      ctx.fillStyle = POWER_INFO[t].color;
      ctx.font = "700 12px sans-serif";
      ctx.fillText(POWER_INFO[t].short + " " + Math.ceil(v) + "s", ex, 52);
      ex -= 64;
    }
  });

  // 奶蛙观众席（底部边缘蹦迪，越连击越嗨，暴走时疯狂换装）
  const hype = frenzy > 0 ? 2.2 : 1 + Math.min(combo * 0.07, 1);
  for (let i = 0; i < 9; i++) {
    const ax = 22 + (W - 44) / 8 * i;
    const bounce = Math.abs(Math.sin(fxTime * 3 * hype + i * 1.7)) * (3 + hype * 2.5);
    const ai = (i + (frenzy > 0 ? Math.floor(fxTime * 5) : 0)) % STAGE_IMGS.length;
    drawSprite(STAGE_IMGS[ai], ax, H - 8 - bounce, 17, Math.sin(fxTime * 4 + i) * 0.14, 0.85);
  }

  // 砖块
  bricks.forEach(k => {
    if (k.steel) {
      // 钢砖：奶白色钢板 + 四角铆钉
      ctx.fillStyle = "#c3ccd3"; ctx.strokeStyle = "#8a99a5"; ctx.lineWidth = 2;
      roundRect(k.x, k.y, k.w, k.h, 6); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#8a99a5";
      [[7, 7], [k.w - 7, 7], [7, k.h - 7], [k.w - 7, k.h - 7]].forEach(([rx, ry]) => {
        ctx.beginPath(); ctx.arc(k.x + rx, k.y + ry, 1.8, 0, Math.PI * 2); ctx.fill();
      });
      return;
    }
    if (k.boom) {
      // 爆炸奶块：草莓奶块 + 引信标记
      ctx.fillStyle = "#f28a7b"; ctx.strokeStyle = "#d96a5a"; ctx.lineWidth = 2;
      roundRect(k.x, k.y, k.w, k.h, 6); ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#fff";
      ctx.font = "700 13px sans-serif"; ctx.textAlign = "center";
      ctx.fillText("✸", k.x + k.w / 2, k.y + k.h / 2 + 4);
      return;
    }
    ctx.fillStyle = BRICK_COLORS[k.hp];
    ctx.strokeStyle = BRICK_EDGE[k.hp];
    ctx.lineWidth = 2;
    roundRect(k.x, k.y, k.w, k.h, 6);
    ctx.fill(); ctx.stroke();
    if (k.maxHp === 3 && k.hp === k.maxHp) drawSprite(STAGE_IMGS[0], k.x + k.w / 2, k.y + k.h / 2, 15, 0, 0.6);
    if (k.maxHp > 1 && k.hp > 1) {
      ctx.fillStyle = "rgba(255,255,255,0.6)";
      ctx.font = "700 11px sans-serif"; ctx.textAlign = "center";
      ctx.fillText("★".repeat(k.hp - 1), k.x + k.w / 2, k.y + k.h / 2 + 4);
    }
  });

  // 道具
  powers.forEach(p => {
    const info = POWER_INFO[p.type];
    ctx.fillStyle = info.color;
    ctx.strokeStyle = "rgba(0,0,0,0.15)"; ctx.lineWidth = 2;
    roundRect(p.x - 14, p.y - 11, 28, 22, 8);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#fff";
    ctx.font = "700 13px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(info.label, p.x, p.y + 5);
  });

  // 解救出的小奶蛙
  rescueFrogs.forEach(f => drawSprite(STAGE_IMGS[0], f.x, f.y, 16, f.rot, 0.95));

  // 激光奶弹
  bullets.forEach(bl => {
    ctx.fillStyle = "#f2a05a";
    roundRect(bl.x - 2, bl.y - 8, 4, 12, 2); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.7)";
    roundRect(bl.x - 1, bl.y - 7, 2, 5, 1); ctx.fill();
  });

  // 奶波涟漪
  rings.forEach(r => {
    const p = r.t / r.life;
    ctx.globalAlpha = (1 - p) * 0.5;
    ctx.strokeStyle = r.color;
    ctx.lineWidth = 3 * (1 - p) + 1;
    ctx.beginPath(); ctx.arc(r.x, r.y, 6 + p * r.max, 0, Math.PI * 2); ctx.stroke();
  });
  ctx.globalAlpha = 1;

  // 粒子
  parts.forEach(q => {
    ctx.globalAlpha = 1 - q.t / q.life;
    ctx.fillStyle = q.color;
    ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, Math.PI * 2); ctx.fill();
  });
  ctx.globalAlpha = 1;

  // 挡板（奶蛙）
  ctx.fillStyle = "#ffe2a0";
  ctx.strokeStyle = "#e0a83c"; ctx.lineWidth = 2;
  roundRect(paddle.x - paddle.w / 2, PADDLE_Y, paddle.w, paddle.h, 8);
  ctx.fill(); ctx.stroke();
  drawFrog(paddle.x, PADDLE_Y + 2, paddle.face, 0.9);
  // 激光炮管
  if (effects.laser > 0) {
    ctx.fillStyle = "#8a99a5"; ctx.strokeStyle = "#6b7a85"; ctx.lineWidth = 1.5;
    roundRect(paddle.x - paddle.w / 2 - 2, PADDLE_Y - 9, 8, 11, 3); ctx.fill(); ctx.stroke();
    roundRect(paddle.x + paddle.w / 2 - 6, PADDLE_Y - 9, 8, 11, 3); ctx.fill(); ctx.stroke();
  }
  // 磁力光环
  if (effects.catch > 0) {
    ctx.strokeStyle = "rgba(242,123,184,0.85)"; ctx.lineWidth = 2;
    roundRect(paddle.x - paddle.w / 2 - 4, PADDLE_Y - 3, paddle.w + 8, paddle.h + 6, 10); ctx.stroke();
  }

  // 球（奶珠）
  balls.forEach(b => {
    if (b.frog) {
      // 奶蛙分身：朝运动方向的小奶蛙球 + 拖尾
      const ta = Math.atan2(b.vy, b.vx) + Math.PI / 2;
      (b.trail || []).forEach((tp, ti) => drawSprite(STAGE_IMGS[0], tp.x, tp.y, 16 + ti * 0.6, ta, 0.06 + ti * 0.028));
      drawSprite(STAGE_IMGS[0], b.x, b.y, 21, ta, 1);
      return;
    }
    // 投影
    ctx.fillStyle = "rgba(180,150,90,0.18)";
    ctx.beginPath(); ctx.ellipse(b.x, b.y + BALL_R + 2, BALL_R * 0.9, BALL_R * 0.4, 0, 0, Math.PI * 2); ctx.fill();
    // 珠体：白到奶色渐变 + 深描边
    const g = ctx.createRadialGradient(b.x - 2.5, b.y - 3, 1, b.x, b.y, BALL_R + 1);
    g.addColorStop(0, "#ffffff");
    g.addColorStop(0.7, "#f7efdc");
    g.addColorStop(1, "#e6d6b4");
    ctx.fillStyle = g;
    ctx.strokeStyle = "#b09a6e"; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.arc(b.x, b.y, BALL_R, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    // 高光
    ctx.fillStyle = "rgba(255,255,255,0.95)";
    ctx.beginPath(); ctx.arc(b.x - 2.4, b.y - 2.8, 1.9, 0, Math.PI * 2); ctx.fill();
  });

  // 飘字（进化等）
  floats.forEach(f => {
    ctx.globalAlpha = Math.max(0, 1 - f.t / f.life);
    ctx.fillStyle = f.color;
    ctx.font = "700 " + (f.size || 16) + "px 'PingFang SC','Microsoft YaHei',sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(f.txt, f.x, f.y);
  });
  ctx.globalAlpha = 1;

  // 抽象弹幕
  danmaku.forEach(d => {
    const p = d.t / d.life;
    const a = p < 0.15 ? p / 0.15 : (1 - Math.max(0, (p - 0.7) / 0.3));
    ctx.save();
    ctx.globalAlpha = Math.max(0, a) * 0.85;
    ctx.translate(d.x, d.y);
    ctx.rotate(d.rot);
    ctx.font = "900 " + d.size + "px 'PingFang SC','Microsoft YaHei',sans-serif";
    ctx.textAlign = "center";
    ctx.lineWidth = 5;
    ctx.strokeStyle = "rgba(255,255,255,0.9)";
    ctx.strokeText(d.txt, 0, 0);
    ctx.fillStyle = frenzy > 0 ? "hsl(" + Math.round((fxTime * 160 + d.y) % 360) + " 75% 42%)" : "#e8963c";
    ctx.fillText(d.txt, 0, 0);
    ctx.restore();
  });
  ctx.globalAlpha = 1;

  // 待发射 / 磁力吸住提示 + 瞄准辅助线
  if (state === S.PLAY && (!launched || balls.some(b => b.held))) {
    ctx.fillStyle = "#c4b190";
    ctx.font = "500 14px 'PingFang SC',sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(launched ? "磁力吸住啦！点击 / 空格 释放" : "点击 / 空格 发射奶珠", W / 2, PADDLE_Y - 46);
    balls.forEach(b => {
      if (!b.stuck) return;
      const a = aimAngleFor(b);
      ctx.strokeStyle = "rgba(232,150,60,0.7)";
      ctx.setLineDash([5, 6]); ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(b.x, b.y);
      ctx.lineTo(b.x + Math.cos(a) * 90, b.y + Math.sin(a) * 90);
      ctx.stroke();
      ctx.setLineDash([]);
    });
  }

  ctx.restore();
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ---------- 主循环（固定步进） ---------- */
const STEP = 1 / 120;
let acc = 0, last = performance.now();
function loop(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  if (slowmoT > 0) { slowmoT -= dt; dt *= 0.32; }  // 终结慢动作
  acc += dt;
  while (acc >= STEP) { update(STEP); acc -= STEP; }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* 初始：主菜单 */
showDlg("dlgMenu");
</script>
